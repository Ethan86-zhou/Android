plugins { id 'com.android.application' }
android {
    namespace 'com.ethan.lexi'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.ethan.lexi'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'com.ethan.lexi.DictionaryInstrumentation'
    }
    androidResources { noCompress 'pack' }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
