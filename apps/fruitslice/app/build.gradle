plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ethan.fruitslice'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.ethan.fruitslice'
        minSdk 36
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
        testInstrumentationRunner 'com.ethan.fruitslice.GameInstrumentation'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
